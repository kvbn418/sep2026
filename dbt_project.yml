# ══════════════════════════════════════════════════════════════════════
# dbt_project.yml
# Master project configuration file
# CRITICAL: name must exactly match the models: key below
# ══════════════════════════════════════════════════════════════════════

name: 'default'       # must match models: sf_tableau_dbt: key below
version: '1.0.0'
config-version: 2

# profile: ignored by dbt Cloud but required for dbt Core compatibility
profile: 'default'

# ── Folder paths ──────────────────────────────────────────────────────
model-paths:    ["models"]
seed-paths:     ["seeds"]
test-paths:     ["tests"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
target-path:    "target"       # compiled SQL lives here — git-ignored
clean-targets:  ["target", "dbt_packages"]

# ── Project variables ─────────────────────────────────────────────────
# Access in models with: var('start_date', '2024-01-01')
vars:
  project_name: 'sf_tableau_dbt'
  start_date:   '2024-01-01'

# ── Model configurations ──────────────────────────────────────────────
# The + prefix applies config to the folder AND all subfolders
# Without + dbt treats the key as a subfolder name (silent failure)
models:
  default:          # must match 'name' above exactly

    bronze:
      +materialized: view  # Bronze = VIEWs, zero storage cost, always live
      +schema: bronze      # dev → SF_DBT_TABLEAU | prod → PROD_DB.BRONZE
      +tags: ['bronze']    # selective runs: dbt run --select tag:bronze

    silver:
      +materialized: table # Silver = TABLEs, physically stored, fast for BI
      +schema: silver      # dev → SF_DBT_TABLEAU | prod → PROD_DB.SILVER
      +tags: ['silver']

    gold:
      +materialized: table # Gold = TABLEs, business-ready, Tableau connects here
      +schema: gold        # dev → SF_DBT_TABLEAU | prod → PROD_DB.GOLD
      +tags: ['gold']

# ── Snapshot configurations ───────────────────────────────────────────
snapshots:
  default:
    +target_schema: SNAPSHOTS
    +target_database: DEV_DB

# ── Seed configurations ───────────────────────────────────────────────
seeds:
  default:
    +schema: seeds